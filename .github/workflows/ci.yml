name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js dist/assets/*.css >> "$GITHUB_STEP_SUMMARY"
